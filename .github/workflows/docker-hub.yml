name: Publish Docker Hub images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: docker-hub
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push application
        uses: docker/build-push-action@v6
        with:
          context: ./app
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-app:${{ inputs.tag }}
          cache-from: type=gha,scope=docker-hub-app
          cache-to: type=gha,mode=max,scope=docker-hub-app
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          target: production
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kafka-worker:${{ inputs.tag }}
          cache-from: type=gha,scope=docker-hub-worker
          cache-to: type=gha,mode=max,scope=docker-hub-worker
